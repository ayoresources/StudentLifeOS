<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Life OS</title>
    <style>
        :root { --primary: #006b3c; --light: #f9f9f9; }
        body { font-family: sans-serif; margin: 0; background: var(--light); }
        .container { max-width: 800px; margin: 40px auto; background: white; padding: 30px; border-radius: 10px; display: none; }
        .active { display: block; }
        input, select { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; box-sizing: border-box; }
        button { background: var(--primary); color: white; padding: 15px; border: none; width: 100%; cursor: pointer; }
        .checkbox-group label { display: inline-block; margin-right: 15px; background: #eee; padding: 5px 10px; border-radius: 15px; }
    </style>
</head>
<body>

<div style="text-align:center; padding:20px;">
    <h1 style="color:var(--primary);">Student Life OS</h1>
    <button style="width:auto;" onclick="show('landing')">Home</button>
    <button style="width:auto;" onclick="show('login')">Log In</button>
</div>

<div id="landing" class="container active">
    <h2>Balance Your Life.</h2>
    <p>The operating system for Academics, Religion, and Business.</p>
    <button onclick="show('signup')">Get Started</button>
</div>

<div id="signup" class="container">
    <h2>Create Profile</h2>
    <form onsubmit="handleRegister(event)">
        <input type="text" id="regName" placeholder="Full Name" required>
        <input type="tel" id="regPhone" placeholder="Phone Number" required>
        <input type="password" id="regPass" placeholder="Create Password" required>
        <select id="regReligion">
            <option value="Islam">Islam</option>
            <option value="Christianity">Christianity</option>
        </select>
        <select id="regGender">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>
        <p>Activities:</p>
        <div class="checkbox-group">
            <label><input type="checkbox" value="Business" class="act"> Business</label>
            <label><input type="checkbox" value="Politics" class="act"> Politics</label>
            <label><input type="checkbox" value="Sports" class="act"> Sports</label>
        </div>
        <br>
        <button type="submit" id="btn-reg">Initialize OS</button>
    </form>
</div>

<div id="login" class="container">
    <h2>Student Login</h2>
    <form onsubmit="handleLogin(event)">
        <input type="tel" id="loginPhone" placeholder="Phone" required>
        <input type="password" id="loginPass" placeholder="Password" required>
        <button type="submit" id="btn-login">Log In</button>
    </form>
</div>

<div style="text-align: center; margin-top: 50px; opacity: 0.3;">
    <a href="admin-login.html" style="text-decoration: none; color: black; font-size: 0.8rem;">Admin Access</a>
</div>

<script>
    function show(id) { document.querySelectorAll('.container').forEach(d => d.classList.remove('active')); document.getElementById(id).classList.add('active'); }

    async function handleRegister(e) {
        e.preventDefault();
        const btn = document.getElementById('btn-reg');
        btn.innerText = "Processing...";
        const data = {
            name: document.getElementById('regName').value,
            phone: document.getElementById('regPhone').value,
            password: document.getElementById('regPass').value,
            religion: document.getElementById('regReligion').value,
            gender: document.getElementById('regGender').value,
            activities: Array.from(document.querySelectorAll('.act:checked')).map(c => c.value)
        };
        const res = await fetch('/api/register', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
        if(res.ok) {
            const result = await res.json();
            localStorage.setItem('userProfile', JSON.stringify(result.user));
            window.location.href = 'dashboard.html';
        } else { alert("Error registering."); btn.innerText = "Try Again"; }
    }

    async function handleLogin(e) {
        e.preventDefault();
        const btn = document.getElementById('btn-login');
        btn.innerText = "Verifying...";
        const res = await fetch('/api/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ phone: document.getElementById('loginPhone').value, password: document.getElementById('loginPass').value }) });
        if(res.ok) {
            const result = await res.json();
            localStorage.setItem('userProfile', JSON.stringify(result.user));
            window.location.href = 'dashboard.html';
        } else { alert("Invalid Login"); btn.innerText = "Log In"; }
    }
</script>
</body>
</html>
