<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <style>body { display:flex; justify-content:center; align-items:center; height:100vh; background:#333; font-family:sans-serif; }</style>
</head>
<body>
    <div style="background:white; padding:30px; border-radius:10px; width:300px;">
        <h2 style="text-align:center;">Admin Access</h2>
        <form onsubmit="adminLogin(event)">
            <input type="text" id="admUser" placeholder="Username" style="width:100%; padding:10px; margin-bottom:10px;" required>
            <input type="password" id="admPass" placeholder="Password" style="width:100%; padding:10px; margin-bottom:10px;" required>
            <button style="width:100%; padding:10px; background:black; color:white; border:none;">Enter</button>
        </form>
    </div>
    <script>
        async function adminLogin(e) {
            e.preventDefault();
            const u = document.getElementById('admUser').value;
            const p = document.getElementById('admPass').value;
            
            const res = await fetch('/api/admin-login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username: u, password: p })
            });
            
            if(res.ok) {
                sessionStorage.setItem('adminToken', 'LOGGED_IN');
                window.location.href = 'admin.html';
            } else {
                alert("Access Denied");
            }
        }
    </script>
</body>
</html>
